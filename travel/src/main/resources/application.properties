spring.application.name=travel
server.port=${PORT:8080}

# TourAPI
api.tour.key=${TOUR_API_KEY}
api.tour.base-url=https://apis.data.go.kr/B551011/KorService2

# 기상청 날씨
api.weather.key=${WEATHER_API_KEY}
api.weather.base-url=https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0

# 주차 정보
api.parking.key=${PARKING_API_KEY}
api.parking.base-url=https://apis.data.go.kr/B553881/Parking

# 휴게소 정보
api.restarea.key=${RESTAREA_API_KEY}
api.restarea.base-url=https://data.ex.co.kr/openapi

# CORS 허용 도메인 (콤마로 구분, 배포된 프론트 도메인 추가)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 캐시설정
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=300,expireAfterWrite=3m

logging.level.com.trip.travel=INFO